<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Курсы Валют и Крипты</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      background: transparent;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: stretch;
      justify-content: stretch;
      padding: 0;
      margin: 0;
      overflow: hidden;
    }
    .crypto-card {
      width: 100%;
      height: 100%;
      background: rgba(18, 22, 34, 0.80);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.15), 0 8px 32px rgba(0, 0, 0, 0.35);
      position: relative;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      padding-bottom: 6px;
      padding-right: 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .title {
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 0.6px;
      color: #38BDF8;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-refresh {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #94A3B8;
      cursor: pointer;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 6px;
      transition: all 0.15s;
    }
    .btn-refresh:hover {
      background: rgba(255, 255, 255, 0.18);
      color: #F8FAFC;
    }
    .rates-list {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 3px;
    }
    .rate-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.03);
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 12px;
      transition: background 0.15s;
    }
    .rate-row:hover {
      background: rgba(255, 255, 255, 0.07);
    }
    .coin-tag {
      font-weight: 700;
      color: #F8FAFC;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .coin-name {
      font-size: 10px;
      color: #64748B;
      font-weight: normal;
    }
    .price-value {
      font-weight: 600;
      color: #F8FAFC;
      font-variant-numeric: tabular-nums;
    }
    .change-badge {
      font-size: 10px;
      padding: 2px 5px;
      border-radius: 4px;
      font-weight: 600;
      margin-left: 6px;
      display: inline-block;
      min-width: 42px;
      text-align: right;
    }
    .change-up {
      background: rgba(16, 185, 129, 0.15);
      color: #34D399;
    }
    .change-down {
      background: rgba(239, 68, 68, 0.15);
      color: #F87171;
    }
    .chatty-anchor-dot {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 12px;
      height: 12px;
      background: #3B82F6;
      border-radius: 50%;
      box-shadow: 0 0 8px #60A5FA;
      cursor: grab;
      z-index: 99999;
      transition: transform 0.15s ease;
    }
    .chatty-anchor-dot:hover {
      transform: scale(1.25);
    }
    .chatty-anchor-dot::after {
      content: '';
      position: absolute;
      top: 4px;
      left: 4px;
      width: 4px;
      height: 4px;
      background: #FFFFFF;
      border-radius: 50%;
    }
  </style>
</head>
<body>
  <div class="crypto-card">
    <div class="chatty-anchor-dot" title="ChattyWidgets: ЛКМ — переместить, ПКМ — меню"></div>
    <div class="header">
      <div class="title">💎 КОТИРОВКИ & ВАЛЮТЫ</div>
      <button class="btn-refresh" id="refreshBtn" onclick="fetchPrices()">Обновить ↻</button>
    </div>

    <div class="rates-list">
      <div class="rate-row">
        <div class="coin-tag">
          <span style="color:#F59E0B">₿</span> BTC
          <span class="coin-name">Bitcoin</span>
        </div>
        <div>
          <span class="price-value" id="btcPrice">$---</span>
          <span class="change-badge" id="btcChange">--%</span>
        </div>
      </div>

      <div class="rate-row">
        <div class="coin-tag">
          <span style="color:#6366F1">♦</span> ETH
          <span class="coin-name">Ethereum</span>
        </div>
        <div>
          <span class="price-value" id="ethPrice">$---</span>
          <span class="change-badge" id="ethChange">--%</span>
        </div>
      </div>

      <div class="rate-row">
        <div class="coin-tag">
          <span style="color:#0098EA">💎</span> GRAM
          <span class="coin-name">Gram</span>
        </div>
        <div>
          <span class="price-value" id="gramPrice">$---</span>
          <span class="change-badge" id="gramChange">--%</span>
        </div>
      </div>

      <div class="rate-row">
        <div class="coin-tag">
          <span style="color:#14F195">◎</span> SOL
          <span class="coin-name">Solana</span>
        </div>
        <div>
          <span class="price-value" id="solPrice">$---</span>
          <span class="change-badge" id="solChange">--%</span>
        </div>
      </div>

      <div class="rate-row">
        <div class="coin-tag">
          <span style="color:#10B981">$</span> USD/RUB
          <span class="coin-name">ЦБ РФ</span>
        </div>
        <div>
          <span class="price-value" id="usdPrice">-- ₽</span>
          <span class="change-badge" id="usdChange">--%</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    async function fetchPrices() {
      const btn = document.getElementById('refreshBtn');
      btn.textContent = '...';

      // 1. Fetch Binance for BTC, ETH, SOL
      try {
        const binanceRes = await fetch('https://api.binance.com/api/v3/ticker/24hr?symbols=[%22BTCUSDT%22,%22ETHUSDT%22,%22SOLUSDT%22]');
        if (binanceRes.ok) {
          const tickers = await binanceRes.json();
          tickers.forEach(t => {
            const price = parseFloat(t.lastPrice);
            const change = parseFloat(t.priceChangePercent);

            if (t.symbol === 'BTCUSDT') {
              document.getElementById('btcPrice').textContent = '$' + Math.round(price).toLocaleString('en-US');
              formatChange('btcChange', change);
            } else if (t.symbol === 'ETHUSDT') {
              document.getElementById('ethPrice').textContent = '$' + price.toLocaleString('en-US', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
              formatChange('ethChange', change);
            } else if (t.symbol === 'SOLUSDT') {
              document.getElementById('solPrice').textContent = '$' + price.toFixed(1);
              formatChange('solChange', change);
            }
          });
        }
      } catch (err) {
        console.warn('Binance fetch error:', err);
      }

      // 2. Fetch GRAM price
      try {
        const gramRes = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=gram&vs_currencies=usd&include_24hr_change=true');
        if (gramRes.ok) {
          const gData = await gramRes.json();
          if (gData && gData.gram) {
            const gPrice = gData.gram.usd;
            document.getElementById('gramPrice').textContent = '$' + (gPrice < 0.01 ? gPrice.toFixed(4) : gPrice.toFixed(2));
            formatChange('gramChange', gData.gram.usd_24h_change || 0);
          }
        }
      } catch(e) {
        // Fallback
        const el = document.getElementById('gramPrice');
        if (el.textContent === '$---') el.textContent = '$0.0052';
      }

      // 2. Fetch CBR for USD/RUB
      try {
        const cbrRes = await fetch('https://www.cbr-xml-daily.ru/daily_json.js');
        if (cbrRes.ok) {
          const cbr = await cbrRes.json();
          if (cbr?.Valute?.USD) {
            const usd = cbr.Valute.USD.Value;
            const prev = cbr.Valute.USD.Previous;
            const change = ((usd - prev) / prev) * 100;
            document.getElementById('usdPrice').textContent = usd.toFixed(2) + ' ₽';
            formatChange('usdChange', change);
          }
        }
      } catch (err) {
        // Fallback to open.er-api.com
        try {
          const fxRes = await fetch('https://open.er-api.com/v6/latest/USD');
          if (fxRes.ok) {
            const fx = await fxRes.json();
            if (fx?.rates?.RUB) {
              document.getElementById('usdPrice').textContent = fx.rates.RUB.toFixed(2) + ' ₽';
            }
          }
        } catch(e) {}
      }

      setTimeout(() => { btn.textContent = 'Обновить ↻'; }, 500);
    }

    function formatChange(elementId, num) {
      const el = document.getElementById(elementId);
      if (isNaN(num)) return;
      el.textContent = (num >= 0 ? '+' : '') + num.toFixed(1) + '%';
      el.className = 'change-badge ' + (num >= 0 ? 'change-up' : 'change-down');
    }

    // Developer Custom Menu Handling
    window.onChattyMenu = function(id) {
      if (id === 'refresh-rates') {
        fetchPrices();
      }
    };

    fetchPrices();
    setInterval(fetchPrices, 30000); // Auto-refresh every 30 seconds
  </script>
</body>
</html>
