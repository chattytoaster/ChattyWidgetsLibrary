<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>GPU Monitor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="gpu-card">
        <div class="header">
            <div class="header-left">
                <div class="gpu-icon">🎮</div>
                <div class="title-group">
                    <span class="gpu-title">GPU ENGINE</span>
                    <span class="gpu-model" id="gpu-name">Загрузка...</span>
                </div>
            </div>
            <div class="temp-badge">
                <span>🔥</span>
                <span id="gpu-temp">--°C</span>
            </div>
        </div>

        <div class="metrics-grid">
            <div class="metric-box">
                <div class="metric-header">
                    <span>ЗАГРУЗКА</span>
                    <span>%</span>
                </div>
                <div class="metric-value" id="gpu-load">0%</div>
                <div class="progress-track">
                    <div class="progress-fill" id="gpu-bar"></div>
                </div>
            </div>

            <div class="metric-box">
                <div class="metric-header">
                    <span>ВИДЕОПАМЯТЬ</span>
                    <span id="vram-ratio">0/0 GB</span>
                </div>
                <div class="metric-value vram-val" id="vram-load">0%</div>
                <div class="progress-track">
                    <div class="progress-fill vram" id="vram-bar"></div>
                </div>
            </div>
        </div>

        <div class="footer-info">
            <span>DirectX / DWM Hardware</span>
            <span id="vram-free">Память свободна</span>
        </div>
    </div>

    <script>
        function updateGpuMetrics() {
            try {
                if (window.chatty) {
                    const name = window.chatty.getGpuName() || 'GPU Engine';
                    const load = window.chatty.getGpuPercent();
                    const vramPct = window.chatty.getGpuMemoryPercent();
                    const vramUsed = window.chatty.getGpuMemoryUsed();
                    const vramTotal = window.chatty.getGpuMemoryTotal();
                    const temp = window.chatty.getGpuTemperature();

                    document.getElementById('gpu-name').innerText = name;
                    document.getElementById('gpu-load').innerText = Math.round(load) + '%';
                    document.getElementById('gpu-bar').style.width = Math.min(100, Math.max(0, load)) + '%';

                    document.getElementById('vram-load').innerText = Math.round(vramPct) + '%';
                    document.getElementById('vram-bar').style.width = Math.min(100, Math.max(0, vramPct)) + '%';
                    document.getElementById('vram-ratio').innerText = vramUsed + '/' + vramTotal + ' GB';

                    document.getElementById('gpu-temp').innerText = Math.round(temp) + '°C';
                    const freeGb = Math.max(0, (vramTotal - vramUsed).toFixed(1));
                    document.getElementById('vram-free').innerText = 'Свободно: ' + freeGb + ' GB';
                }
            } catch (e) {
                console.error(e);
            }
        }

        setInterval(updateGpuMetrics, 1500);
        setTimeout(updateGpuMetrics, 200);
    </script>
</body>
</html>
