<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Glass Analog Clock</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: transparent !important;
      background-color: transparent !important;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI Variable Display', 'Segoe UI', Inter, Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Outer Clock Container */
    .clock-container {
      position: relative;
      width: 94vmin;
      height: 94vmin;
      max-width: 94vw;
      max-height: 94vh;
      border-radius: 50%;
      cursor: grab;
      background: transparent !important;
      background-color: transparent !important;
      filter: none !important;
      -webkit-filter: none !important;
      box-shadow: none !important;
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .clock-container:active {
      cursor: grabbing;
    }

    /* SVG Canvas */
    svg {
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
      filter: none !important;
      -webkit-filter: none !important;
      box-shadow: none !important;
    }

    /* Theme Accent Definitions */
    :root {
      --accent-color: #00f2fe;
      --accent-glow: rgba(0, 242, 254, 0.6);
      --second-color: #00f2fe;
      --second-glow: rgba(0, 242, 254, 0.85);
      --dial-bg-1: #161b26;
      --dial-bg-2: #0b0e14;
      --bezel-highlight: rgba(255, 255, 255, 0.28);
      --bezel-border: rgba(255, 255, 255, 0.16);
      --text-color: #f1f5f9;
      --subtext-color: rgba(255, 255, 255, 0.6);
    }

    /* Theme Classes */
    body.theme-neon-cyan {
      --accent-color: #00f2fe;
      --accent-glow: rgba(0, 242, 254, 0.6);
      --second-color: #38bdf8;
      --second-glow: rgba(56, 189, 248, 0.9);
      --dial-bg-1: #0f172a;
      --dial-bg-2: #020617;
    }

    body.theme-minimal-dark {
      --accent-color: #e2e8f0;
      --accent-glow: rgba(226, 232, 240, 0.3);
      --second-color: #ef4444;
      --second-glow: rgba(239, 68, 68, 0.85);
      --dial-bg-1: #1e2029;
      --dial-bg-2: #0d0e12;
    }

    body.theme-gold-luxury {
      --accent-color: #facc15;
      --accent-glow: rgba(250, 204, 21, 0.6);
      --second-color: #fbbf24;
      --second-glow: rgba(251, 191, 36, 0.85);
      --dial-bg-1: #1c1917;
      --dial-bg-2: #0c0a09;
    }

    body.theme-amethyst-glow {
      --accent-color: #c084fc;
      --accent-glow: rgba(192, 132, 252, 0.65);
      --second-color: #f472b6;
      --second-glow: rgba(244, 114, 182, 0.85);
      --dial-bg-1: #1e112a;
      --dial-bg-2: #0b0512;
    }

    body.theme-emerald {
      --accent-color: #34d399;
      --accent-glow: rgba(52, 211, 153, 0.6);
      --second-color: #10b981;
      --second-glow: rgba(16, 185, 129, 0.85);
      --dial-bg-1: #062018;
      --dial-bg-2: #020d0a;
    }

    /* Vector styling */
    .dial-bezel-outer {
      fill: none;
      stroke: var(--bezel-border);
      stroke-width: 1.5;
    }

    .dial-glass-face {
      fill: url(#dial-gradient);
      stroke: var(--bezel-highlight);
      stroke-width: 1.2;
    }

    .dial-inner-ring {
      fill: none;
      stroke: rgba(255, 255, 255, 0.08);
      stroke-width: 1;
    }

    .hour-tick {
      stroke: var(--accent-color);
      stroke-width: 3.2;
      stroke-linecap: round;
      filter: drop-shadow(0 0 3px var(--accent-glow));
    }

    .minute-tick {
      stroke: rgba(255, 255, 255, 0.22);
      stroke-width: 1.4;
      stroke-linecap: round;
    }

    .cardinal-number {
      font-size: 20px;
      font-weight: 700;
      fill: var(--text-color);
      text-anchor: middle;
      dominant-baseline: central;
      font-feature-settings: "tnum";
      letter-spacing: -0.5px;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8));
      transition: opacity 0.3s ease;
    }

    /* Date Aperture Box */
    .date-badge {
      transition: opacity 0.3s ease;
    }

    .date-box-bg {
      fill: rgba(15, 23, 42, 0.7);
      stroke: rgba(255, 255, 255, 0.16);
      stroke-width: 1;
      backdrop-filter: blur(8px);
    }

    .date-day-text {
      font-size: 8.5px;
      font-weight: 700;
      fill: var(--accent-color);
      text-anchor: middle;
      dominant-baseline: central;
      letter-spacing: 0.8px;
    }

    .date-num-text {
      font-size: 11px;
      font-weight: 800;
      fill: #ffffff;
      text-anchor: middle;
      dominant-baseline: central;
      font-feature-settings: "tnum";
    }

    /* Hands Layer */
    .hand-hour-left {
      fill: #f8fafc;
    }
    .hand-hour-right {
      fill: #94a3b8;
    }
    .hand-hour-inlay {
      fill: var(--accent-color);
      opacity: 0.8;
      filter: drop-shadow(0 0 2px var(--accent-glow));
    }

    .hand-minute-left {
      fill: #ffffff;
    }
    .hand-minute-right {
      fill: #cbd5e1;
    }
    .hand-minute-inlay {
      fill: var(--accent-color);
      opacity: 0.85;
      filter: drop-shadow(0 0 3px var(--accent-glow));
    }

    .hand-shadow {
      filter: drop-shadow(0 5px 8px rgba(0, 0, 0, 0.65));
    }

    .hand-second {
      stroke: var(--second-color);
      stroke-width: 1.8;
      stroke-linecap: round;
      filter: drop-shadow(0 0 4px var(--second-glow));
      transition: opacity 0.3s ease;
    }

    .hand-second-tail {
      stroke: var(--second-color);
      stroke-width: 2.4;
      stroke-linecap: round;
    }

    .hand-second-ring {
      fill: none;
      stroke: var(--second-color);
      stroke-width: 1.8;
    }

    .pinion-outer {
      fill: #1e293b;
      stroke: rgba(255, 255, 255, 0.3);
      stroke-width: 1;
    }

    .pinion-jewel {
      fill: var(--second-color);
      filter: drop-shadow(0 0 4px var(--second-glow));
    }
  </style>
</head>
<body class="theme-neon-cyan">

  <div class="clock-container" id="clockCard" title="ChattyWidgets: ЛКМ — переместить, ПКМ — настройки">
    <svg viewBox="-110 -110 220 220">
      <defs>
        <!-- Radial Dial Gradient -->
        <radialGradient id="dial-gradient" cx="50%" cy="50%" r="50%" fx="35%" fy="35%">
          <stop offset="0%" stop-color="var(--dial-bg-1)" />
          <stop offset="65%" stop-color="var(--dial-bg-2)" />
          <stop offset="100%" stop-color="#05070a" />
        </radialGradient>

        <!-- Subtle Ambient Ring Gradient -->
        <radialGradient id="glass-rim" cx="50%" cy="50%" r="50%">
          <stop offset="85%" stop-color="transparent" />
          <stop offset="98%" stop-color="rgba(255, 255, 255, 0.08)" />
          <stop offset="100%" stop-color="rgba(0, 0, 0, 0.6)" />
        </radialGradient>
      </defs>

      <!-- Glass Bezel & Dial Face -->
      <circle cx="0" cy="0" r="104" class="dial-bezel-outer" />
      <circle cx="0" cy="0" r="102" class="dial-glass-face" />
      <circle cx="0" cy="0" r="102" fill="url(#glass-rim)" />
      <circle cx="0" cy="0" r="82" class="dial-inner-ring" />
      <circle cx="0" cy="0" r="42" class="dial-inner-ring" stroke-dasharray="2 4" />

      <!-- Dial Ticks Group -->
      <g id="ticksGroup"></g>

      <!-- Cardinal Hour Numbers -->
      <g id="numbersGroup">
        <text x="0" y="-62" class="cardinal-number">12</text>
        <text x="64" y="0" class="cardinal-number">3</text>
        <text x="0" y="64" class="cardinal-number">6</text>
        <text x="-64" y="0" class="cardinal-number">9</text>
      </g>

      <!-- Date Aperture Badge (At 3 o'clock offset or bottom) -->
      <g id="dateBadge" class="date-badge" transform="translate(32, 0)">
        <rect x="-14" y="-10" width="28" height="20" rx="6" class="date-box-bg" />
        <text id="dateDayText" x="0" y="-3.5" class="date-day-text">SUN</text>
        <text id="dateNumText" x="0" y="5.5" class="date-num-text">18</text>
      </g>

      <!-- Hands Group with Shadow -->
      <g class="hand-shadow">
        <!-- Hour Hand -->
        <g id="hourHand">
          <!-- Faceted Left and Right Halves for 3D appearance -->
          <polygon points="0,6 -4.5,-40 0,-49" class="hand-hour-left" />
          <polygon points="0,6 4.5,-40 0,-49" class="hand-hour-right" />
          <rect x="-1" y="-42" width="2" height="24" rx="1" class="hand-hour-inlay" />
        </g>

        <!-- Minute Hand -->
        <g id="minuteHand">
          <polygon points="0,8 -3.8,-62 0,-74" class="hand-minute-left" />
          <polygon points="0,8 3.8,-62 0,-74" class="hand-minute-right" />
          <rect x="-1" y="-66" width="2" height="38" rx="1" class="hand-minute-inlay" />
        </g>
      </g>

      <!-- Center Hub Background -->
      <circle cx="0" cy="0" r="6" class="pinion-outer" />

      <!-- Second Hand -->
      <g id="secondHandGroup">
        <line x1="0" y1="18" x2="0" y2="-82" class="hand-second" />
        <line x1="0" y1="18" x2="0" y2="28" class="hand-second-tail" />
        <circle cx="0" cy="20" r="3.5" class="hand-second-ring" />
        <circle cx="0" cy="-66" r="2.8" fill="var(--second-color)" filter="drop-shadow(0 0 3px var(--second-glow))" />
      </g>

      <!-- Pinion Center Cap -->
      <circle cx="0" cy="0" r="3.2" fill="#0f172a" stroke="rgba(255, 255, 255, 0.4)" stroke-width="0.8" />
      <circle cx="0" cy="0" r="1.5" class="pinion-jewel" />
    </svg>
  </div>

  <script>
    (function() {
      // 1. Generate Dial Tick Marks
      const ticksGroup = document.getElementById('ticksGroup');
      for (let i = 0; i < 60; i++) {
        const isHour = i % 5 === 0;
        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        const angle = i * 6; // 360 / 60
        const rad = (angle - 90) * (Math.PI / 180);

        const rOuter = 96;
        const rInner = isHour ? 84 : 90;

        const x1 = Math.cos(rad) * rInner;
        const y1 = Math.sin(rad) * rInner;
        const x2 = Math.cos(rad) * rOuter;
        const y2 = Math.sin(rad) * rOuter;

        line.setAttribute('x1', x1.toFixed(2));
        line.setAttribute('y1', y1.toFixed(2));
        line.setAttribute('x2', x2.toFixed(2));
        line.setAttribute('y2', y2.toFixed(2));
        line.setAttribute('class', isHour ? 'hour-tick' : 'minute-tick');
        ticksGroup.appendChild(line);
      }

      // 2. Elements Cache
      const hourHand = document.getElementById('hourHand');
      const minuteHand = document.getElementById('minuteHand');
      const secondHandGroup = document.getElementById('secondHandGroup');
      const dateBadge = document.getElementById('dateBadge');
      const dateDayText = document.getElementById('dateDayText');
      const dateNumText = document.getElementById('dateNumText');
      const numbersGroup = document.getElementById('numbersGroup');

      // 3. Settings State
      let settings = {
        themeStyle: 'neon-cyan',
        smoothSeconds: true,
        showSeconds: true,
        showDate: true,
        showNumbers: true
      };

      function loadSettings() {
        if (window.chatty && typeof window.chatty.getSetting === 'function') {
          try {
            const theme = window.chatty.getSetting('themeStyle');
            if (theme) settings.themeStyle = theme;

            const smooth = window.chatty.getSetting('smoothSeconds');
            if (smooth !== '') settings.smoothSeconds = smooth === 'true';

            const secs = window.chatty.getSetting('showSeconds');
            if (secs !== '') settings.showSeconds = secs === 'true';

            const date = window.chatty.getSetting('showDate');
            if (date !== '') settings.showDate = date === 'true';

            const nums = window.chatty.getSetting('showNumbers');
            if (nums !== '') settings.showNumbers = nums === 'true';
          } catch(e) {}
        }
        applySettings();
      }

      function applySettings() {
        document.body.className = `theme-${settings.themeStyle}`;
        secondHandGroup.style.display = settings.showSeconds ? 'block' : 'none';
        dateBadge.style.opacity = settings.showDate ? '1' : '0';
        numbersGroup.style.opacity = settings.showNumbers ? '1' : '0';
      }

      // Listen for live settings changes
      window.addEventListener('chatty:settingsChanged', loadSettings);
      setInterval(loadSettings, 1500);
      loadSettings();

      // 4. Update Date Display
      const daysRu = ['ВС', 'ПН', 'ВТ', 'СР', 'ЧТ', 'ПТ', 'СБ'];
      let lastDay = -1;

      function updateDateDisplay(now) {
        const curDay = now.getDate();
        if (curDay !== lastDay) {
          lastDay = curDay;
          dateDayText.textContent = daysRu[now.getDay()];
          dateNumText.textContent = curDay.toString().padStart(2, '0');
        }
      }

      // 5. Clock Engine (requestAnimationFrame for ultra-smooth 60+ FPS motion)
      let prevSecond = -1;
      let tickAnimProgress = 1;

      function updateClock() {
        const now = new Date();
        const ms = now.getMilliseconds();
        const sec = now.getSeconds();
        const min = now.getMinutes();
        const hr = now.getHours() % 12;

        updateDateDisplay(now);

        // Smooth or Stepwise Seconds Hand
        let secAngle;
        if (settings.smoothSeconds) {
          secAngle = (sec + ms / 1000) * 6; // 360 / 60
        } else {
          // Discrete step with slight mechanical spring
          if (sec !== prevSecond) {
            prevSecond = sec;
            tickAnimProgress = 0;
          }
          if (tickAnimProgress < 1) {
            tickAnimProgress = Math.min(1, tickAnimProgress + 0.18);
          }
          // Slight spring curve
          const spring = Math.sin(tickAnimProgress * Math.PI) * 0.4;
          secAngle = sec * 6 + spring;
        }

        // Minutes: smooth progression with seconds
        const minAngle = (min + (sec + ms / 1000) / 60) * 6;

        // Hours: smooth progression with minutes
        const hrAngle = (hr + min / 60 + sec / 3600) * 30;

        hourHand.setAttribute('transform', `rotate(${hrAngle.toFixed(2)})`);
        minuteHand.setAttribute('transform', `rotate(${minAngle.toFixed(2)})`);
        secondHandGroup.setAttribute('transform', `rotate(${secAngle.toFixed(2)})`);

        requestAnimationFrame(updateClock);
      }

      requestAnimationFrame(updateClock);
    })();
  </script>
</body>
</html>
