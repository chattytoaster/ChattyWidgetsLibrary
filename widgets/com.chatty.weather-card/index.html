<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Прогноз Погоды</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      background: transparent;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: stretch;
      justify-content: stretch;
      padding: 0;
      margin: 0;
      overflow: hidden;
    }
    .weather-card {
      width: 100%;
      height: 100%;
      background: rgba(18, 22, 34, 0.82);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.15), 0 8px 32px rgba(0, 0, 0, 0.4);
      position: relative;
      overflow: hidden;
    }
    .glow-bg {
      position: absolute;
      top: -30%;
      right: -20%;
      width: 130%;
      height: 70%;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.22) 0%, transparent 70%);
      pointer-events: none;
      transition: background 0.5s ease;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-right: 22px;
      z-index: 1;
    }
    .city-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 600;
      color: #38BDF8;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.2);
      padding: 4px 10px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .city-btn:hover {
      background: rgba(56, 189, 248, 0.2);
      transform: scale(1.02);
    }
    .update-time {
      font-size: 11px;
      color: #94A3B8;
    }
    .main-weather {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 4px 0;
      z-index: 1;
    }
    .temp-section {
      display: flex;
      flex-direction: column;
    }
    .temp-row {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }
    .temp-value {
      font-size: 48px;
      font-weight: 700;
      color: #F8FAFC;
      line-height: 1;
      letter-spacing: -1.5px;
      font-variant-numeric: tabular-nums;
    }
    .condition-text {
      font-size: 13.5px;
      font-weight: 600;
      color: #E2E8F0;
      margin-top: 4px;
    }
    .feels-like {
      font-size: 11.5px;
      color: #94A3B8;
      margin-top: 2px;
    }
    .weather-icon-hero {
      font-size: 52px;
      filter: drop-shadow(0 4px 12px rgba(56, 189, 248, 0.3));
      animation: float 4s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    .metrics-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 8px;
      z-index: 1;
    }
    .metric-pill {
      background: rgba(255, 255, 255, 0.04);
      border-radius: 8px;
      padding: 5px 6px;
      text-align: center;
    }
    .metric-title {
      font-size: 9.5px;
      color: #94A3B8;
      margin-bottom: 2px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .metric-val {
      font-size: 11.5px;
      font-weight: 600;
      color: #F8FAFC;
    }
    .city-picker-modal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(14, 18, 28, 0.94);
      backdrop-filter: blur(16px);
      border-radius: 20px;
      z-index: 1000;
      padding: 16px;
      display: none;
      flex-direction: column;
      justify-content: space-between;
    }
    .city-picker-modal.open {
      display: flex;
    }
    .city-picker-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 700;
      color: #F8FAFC;
    }
    .city-close-btn {
      background: none;
      border: none;
      color: #94A3B8;
      font-size: 16px;
      cursor: pointer;
    }
    .city-input {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      padding: 8px 12px;
      color: #F8FAFC;
      font-size: 12px;
      margin: 8px 0;
      outline: none;
    }
    .city-input:focus {
      border-color: #38BDF8;
    }
    .city-quick-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      max-height: 80px;
      overflow-y: auto;
    }
    .city-chip {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #E2E8F0;
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 11px;
      cursor: pointer;
    }
    .city-chip:hover {
      background: #38BDF8;
      color: #0F172A;
    }
    .chatty-anchor-dot {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 12px;
      height: 12px;
      background: #3B82F6;
      border-radius: 50%;
      box-shadow: 0 0 8px #60A5FA;
      cursor: grab;
      z-index: 99999;
      transition: transform 0.15s ease;
    }
    .chatty-anchor-dot:hover {
      transform: scale(1.25);
    }
    .chatty-anchor-dot::after {
      content: '';
      position: absolute;
      top: 4px;
      left: 4px;
      width: 4px;
      height: 4px;
      background: #FFFFFF;
      border-radius: 50%;
    }
  </style>
</head>
<body>
  <div class="weather-card">
    <div class="glow-bg" id="glowBg"></div>
    <div class="chatty-anchor-dot" title="ChattyWidgets: ЛКМ — переместить, ПКМ — меню"></div>

    <div class="header">
      <div class="city-btn" onclick="openCityModal()">
        <span>📍</span>
        <span id="cityName">Москва</span>
        <span style="font-size: 10px; opacity: 0.7;">▼</span>
      </div>
      <div class="update-time" id="updateTime">Обновлено только что</div>
    </div>

    <div class="main-weather">
      <div class="temp-section">
        <div class="temp-row">
          <span class="temp-value" id="tempValue">+14°</span>
        </div>
        <div class="condition-text" id="conditionText">Ясно</div>
        <div class="feels-like" id="feelsLike">Ощущается как +13°</div>
      </div>
      <div class="weather-icon-hero" id="weatherIcon">☀️</div>
    </div>

    <div class="metrics-bar">
      <div class="metric-pill">
        <div class="metric-title">Ветер</div>
        <div class="metric-val" id="valWind">3.2 м/с</div>
      </div>
      <div class="metric-pill">
        <div class="metric-title">Влажность</div>
        <div class="metric-val" id="valHumidity">68%</div>
      </div>
      <div class="metric-pill">
        <div class="metric-title">Мин/Макс</div>
        <div class="metric-val" id="valMinMax">+9° / +16°</div>
      </div>
      <div class="metric-pill">
        <div class="metric-title">Осадки</div>
        <div class="metric-val" id="valPrecip">0 мм</div>
      </div>
    </div>

    <!-- City selection modal -->
    <div class="city-picker-modal" id="cityModal">
      <div class="city-picker-header">
        <span>Выбор города</span>
        <button class="city-close-btn" onclick="closeCityModal()">✕</button>
      </div>
      <input type="text" class="city-input" id="cityInput" placeholder="Поиск города (напр. Казань, Сочи)..." onkeydown="if(event.key==='Enter') searchAndSelectCity()" />
      <div class="city-quick-list">
        <div class="city-chip" style="background:#38BDF8;color:#0F172A;font-weight:700;" onclick="selectAutoLocation()">🌐 Авто (по IP)</div>
        <div class="city-chip" onclick="selectPreset('Москва', 55.7558, 37.6173)">Москва</div>
        <div class="city-chip" onclick="selectPreset('Санкт-Петербург', 59.9343, 30.3351)">СПб</div>
        <div class="city-chip" onclick="selectPreset('Новосибирск', 55.0084, 82.9357)">Новосибирск</div>
        <div class="city-chip" onclick="selectPreset('Екатеринбург', 56.8389, 60.6057)">Екатеринбург</div>
        <div class="city-chip" onclick="selectPreset('Казань', 55.7887, 49.1221)">Казань</div>
        <div class="city-chip" onclick="selectPreset('Сочи', 43.6028, 39.7342)">Сочи</div>
        <div class="city-chip" onclick="selectPreset('Владивосток', 43.1155, 131.8855)">Владивосток</div>
        <div class="city-chip" onclick="selectPreset('Минск', 53.9045, 27.5615)">Минск</div>
        <div class="city-chip" onclick="selectPreset('Алматы', 43.2389, 76.8897)">Алматы</div>
        <div class="city-chip" onclick="selectPreset('Дубай', 25.2048, 55.2708)">Дубай</div>
      </div>
    </div>
  </div>

  <script>
    let currentCity = { name: 'Москва', lat: 55.7558, lon: 37.6173 };

    const wmo = {
      0: { text: 'Ясно', icon: '☀️', glow: 'rgba(245, 158, 11, 0.25)' },
      1: { text: 'Преимущественно ясно', icon: '🌤', glow: 'rgba(56, 189, 248, 0.25)' },
      2: { text: 'Переменная облачность', icon: '⛅', glow: 'rgba(148, 163, 184, 0.25)' },
      3: { text: 'Пасмурно', icon: '☁️', glow: 'rgba(100, 116, 139, 0.25)' },
      45: { text: 'Туман', icon: '🌫', glow: 'rgba(148, 163, 184, 0.2)' },
      48: { text: 'Инейный туман', icon: '🌫', glow: 'rgba(148, 163, 184, 0.2)' },
      51: { text: 'Легкая морось', icon: '🌦', glow: 'rgba(56, 189, 248, 0.25)' },
      53: { text: 'Морось', icon: '🌦', glow: 'rgba(56, 189, 248, 0.25)' },
      55: { text: 'Сильная морось', icon: '🌦', glow: 'rgba(59, 130, 246, 0.3)' },
      61: { text: 'Небольшой дождь', icon: '🌧', glow: 'rgba(59, 130, 246, 0.3)' },
      63: { text: 'Дождь', icon: '🌧', glow: 'rgba(59, 130, 246, 0.35)' },
      65: { text: 'Сильный дождь', icon: '🌧', glow: 'rgba(37, 99, 235, 0.4)' },
      71: { text: 'Небольшой снег', icon: '🌨', glow: 'rgba(147, 197, 253, 0.3)' },
      73: { text: 'Снегопад', icon: '🌨', glow: 'rgba(147, 197, 253, 0.35)' },
      75: { text: 'Сильный снегопад', icon: '❄️', glow: 'rgba(191, 219, 254, 0.4)' },
      80: { text: 'Кратковременный дождь', icon: '🌧', glow: 'rgba(59, 130, 246, 0.3)' },
      81: { text: 'Ливень', icon: '🌧', glow: 'rgba(37, 99, 235, 0.4)' },
      82: { text: 'Шквальный ливень', icon: '⛈', glow: 'rgba(99, 102, 241, 0.4)' },
      95: { text: 'Гроза', icon: '⛈', glow: 'rgba(139, 92, 246, 0.4)' },
      96: { text: 'Гроза с градом', icon: '⛈', glow: 'rgba(139, 92, 246, 0.45)' }
    };

    async function detectLocationAutomatically() {
      try {
        const geoRes = await fetch('https://get.geojs.io/v1/ip/geo.json');
        if (geoRes.ok) {
          const geo = await geoRes.json();
          if (geo.latitude && geo.longitude) {
            currentCity = {
              name: geo.city || geo.region || 'Авто',
              lat: parseFloat(geo.latitude),
              lon: parseFloat(geo.longitude),
              isAuto: true
            };
            document.getElementById('cityName').textContent = currentCity.name;
            if (window.chatty) {
              window.chatty.storageSet('weather_city', JSON.stringify(currentCity));
            }
            return true;
          }
        }
      } catch(e) {}

      // Fallback to freeipapi
      try {
        const altRes = await fetch('https://freeipapi.com/api/json');
        if (altRes.ok) {
          const alt = await altRes.json();
          if (alt.latitude && alt.longitude) {
            currentCity = {
              name: alt.cityName || alt.regionName || 'Авто',
              lat: parseFloat(alt.latitude),
              lon: parseFloat(alt.longitude),
              isAuto: true
            };
            document.getElementById('cityName').textContent = currentCity.name;
            if (window.chatty) {
              window.chatty.storageSet('weather_city', JSON.stringify(currentCity));
            }
            return true;
          }
        }
      } catch(e) {}
      return false;
    }

    async function loadSavedCity() {
      let isManual = false;
      if (window.chatty) {
        const saved = window.chatty.storageGet('weather_city', '');
        if (saved) {
          try {
            const parsed = JSON.parse(saved);
            if (parsed && parsed.name && !parsed.isAuto) {
              currentCity = parsed;
              isManual = true;
            }
          } catch(e) {}
        }
      }

      if (!isManual) {
        await detectLocationAutomatically();
      }
      document.getElementById('cityName').textContent = currentCity.name;
    }

    async function fetchWeather() {
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${currentCity.lat}&longitude=${currentCity.lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min&timezone=auto`;

      try {
        const res = await fetch(url);
        if (res.ok) {
          const data = await res.json();
          const cur = data.current;
          const daily = data.daily;

          if (cur) {
            const temp = Math.round(cur.temperature_2m);
            const feels = Math.round(cur.apparent_temperature);
            const code = cur.weather_code;
            const info = wmo[code] || { text: 'Облачно', icon: '🌤', glow: 'rgba(56, 189, 248, 0.25)' };

            document.getElementById('tempValue').textContent = (temp > 0 ? '+' : '') + temp + '°';
            document.getElementById('conditionText').textContent = info.text;
            document.getElementById('weatherIcon').textContent = info.icon;
            document.getElementById('feelsLike').textContent = `Ощущается как ${(feels > 0 ? '+' : '')}${feels}°`;
            document.getElementById('glowBg').style.background = `radial-gradient(circle, ${info.glow} 0%, transparent 70%)`;

            document.getElementById('valWind').textContent = cur.wind_speed_10m.toFixed(1) + ' м/с';
            document.getElementById('valHumidity').textContent = cur.relative_humidity_2m + '%';
            document.getElementById('valPrecip').textContent = (cur.precipitation || 0) + ' мм';

            if (daily && daily.temperature_2m_min && daily.temperature_2m_max) {
              const minT = Math.round(daily.temperature_2m_min[0]);
              const maxT = Math.round(daily.temperature_2m_max[0]);
              document.getElementById('valMinMax').textContent = `${(minT > 0 ? '+' : '') + minT}° / ${(maxT > 0 ? '+' : '') + maxT}°`;
            }

            const now = new Date();
            const timeStr = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
            document.getElementById('updateTime').textContent = `Обновлено в ${timeStr}`;
          }
        }
      } catch(err) {
        console.warn('Weather fetch error:', err);
      }
    }

    function openCityModal() {
      document.getElementById('cityModal').classList.add('open');
      document.getElementById('cityInput').focus();
    }

    function closeCityModal() {
      document.getElementById('cityModal').classList.remove('open');
    }

    async function selectAutoLocation() {
      await detectLocationAutomatically();
      closeCityModal();
      fetchWeather();
    }

    function selectPreset(name, lat, lon) {
      currentCity = { name, lat, lon, isAuto: false };
      document.getElementById('cityName').textContent = name;
      if (window.chatty) {
        window.chatty.storageSet('weather_city', JSON.stringify(currentCity));
      }
      closeCityModal();
      fetchWeather();
    }

    async function searchAndSelectCity() {
      const query = document.getElementById('cityInput').value.trim();
      if (!query) return;

      try {
        const geoUrl = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=1&language=ru&format=json`;
        const res = await fetch(geoUrl);
        if (res.ok) {
          const data = await res.json();
          if (data.results && data.results.length > 0) {
            const r = data.results[0];
            selectPreset(r.name, r.latitude, r.longitude);
            return;
          }
        }
      } catch(e) {}
      alert('Город не найден, попробуйте еще раз');
    }

    // Developer Custom Menu Handling
    window.onChattyMenu = function(id) {
      if (id === 'refresh-weather') {
        fetchWeather();
      } else if (id === 'change-city') {
        openCityModal();
      }
    };

    loadSavedCity().then(() => fetchWeather());
    setInterval(fetchWeather, 15 * 60 * 1000); // 15 mins
  </script>
</body>
</html>
