<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мини-Медиаплеер</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      background: transparent;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: stretch;
      justify-content: stretch;
      padding: 0;
      margin: 0;
      overflow: hidden;
    }
    .player-card {
      width: 100%;
      height: 100%;
      background: rgba(14, 18, 30, 0.85);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 20px;
      padding: 14px 22px 14px 16px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.18), 0 12px 36px rgba(0, 0, 0, 0.5), 0 0 20px rgba(99, 102, 241, 0.12);
      position: relative;
    }

    /* Art Container with realistic grooved vinyl effect */
    .art-container {
      width: 60px;
      height: 60px;
      position: relative;
      flex-shrink: 0;
    }
    .art-ring {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: radial-gradient(circle at center, #1E1B4B 0%, #0F172A 70%, #020617 100%);
      border: 2px solid rgba(255, 255, 255, 0.18);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 20px rgba(139, 92, 246, 0.45);
      animation: spin 12s linear infinite;
      overflow: hidden;
      transition: border-radius 0.3s ease, box-shadow 0.3s ease;
      position: relative;
    }
    .art-ring.playing {
      box-shadow: 0 0 24px rgba(236, 72, 153, 0.45), 0 0 10px rgba(59, 130, 246, 0.4);
    }
    .art-ring.paused {
      animation-play-state: paused;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    }
    .art-ring.square-mode {
      border-radius: 14px;
      animation: none !important;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
    }
    @keyframes spin {
      100% { transform: rotate(360deg); }
    }
    .art-center {
      width: 20px;
      height: 20px;
      background: #0B0E17;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.45);
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 3;
      box-shadow: 0 0 8px rgba(0,0,0,0.8);
    }
    .art-ring.square-mode .art-center {
      display: none;
    }
    .cover-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
      z-index: 2;
    }

    /* Track details */
    .track-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    /* Marquee container with smooth edge masking */
    .marquee-container {
      width: 100%;
      overflow: hidden;
      white-space: nowrap;
      position: relative;
    }
    .marquee-container.faded {
      mask-image: linear-gradient(to right, transparent 0, black 12px, black calc(100% - 14px), transparent 100%);
      -webkit-mask-image: linear-gradient(to right, transparent 0, black 12px, black calc(100% - 14px), transparent 100%);
    }

    .track-title {
      font-size: 13.5px;
      font-weight: 700;
      color: #F8FAFC;
      letter-spacing: -0.2px;
      display: inline-block;
      white-space: nowrap;
      margin-bottom: 2px;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
    }

    .artist-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
    }

    .track-artist {
      font-size: 11.5px;
      color: #94A3B8;
      font-weight: 500;
      display: inline-block;
      white-space: nowrap;
    }

    /* Equalizer wave bars */
    .eq-bars {
      display: inline-flex;
      align-items: flex-end;
      gap: 2px;
      height: 10px;
      margin-left: 2px;
      opacity: 0.7;
    }
    .eq-bar {
      width: 2.5px;
      background: #38BDF8;
      border-radius: 2px;
      height: 3px;
    }
    .art-ring.playing ~ .track-info .eq-bar:nth-child(1) {
      animation: eqBounce 0.8s ease-in-out infinite alternate;
    }
    .art-ring.playing ~ .track-info .eq-bar:nth-child(2) {
      animation: eqBounce 0.6s ease-in-out infinite 0.2s alternate;
    }
    .art-ring.playing ~ .track-info .eq-bar:nth-child(3) {
      animation: eqBounce 1.0s ease-in-out infinite 0.4s alternate;
    }
    @keyframes eqBounce {
      0% { height: 3px; background: #38BDF8; }
      100% { height: 10px; background: #EC4899; }
    }

    /* Marquee animation */
    @keyframes marqueeScroll {
      0%, 18% {
        transform: translateX(0);
      }
      65%, 82% {
        transform: translateX(var(--marquee-dist, 0px));
      }
      100% {
        transform: translateX(0);
      }
    }
    .is-scrolling {
      animation: marqueeScroll var(--marquee-dur, 8s) ease-in-out infinite !important;
      will-change: transform;
    }

    /* Beautiful Листалка (Controls bar) */
    .controls-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.04);
      padding: 4px 8px;
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      width: fit-content;
    }

    .btn {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #E2E8F0;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
      outline: none;
    }
    .btn:hover {
      background: rgba(255, 255, 255, 0.18);
      border-color: rgba(56, 189, 248, 0.4);
      color: #38BDF8;
      transform: scale(1.1);
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.35);
    }
    .btn:active {
      transform: scale(0.92);
    }

    /* Hero Play/Pause button */
    .btn-play {
      background: linear-gradient(135deg, #6366F1 0%, #8B5CF6 50%, #EC4899 100%);
      border: none;
      color: #FFFFFF;
      width: 36px;
      height: 36px;
      font-size: 15px;
      box-shadow: 0 0 16px rgba(99, 102, 241, 0.55), 0 2px 8px rgba(0, 0, 0, 0.4);
    }
    .btn-play:hover {
      background: linear-gradient(135deg, #4F46E5 0%, #7C3AED 50%, #DB2777 100%);
      box-shadow: 0 0 20px rgba(236, 72, 153, 0.65), 0 4px 12px rgba(0, 0, 0, 0.4);
      color: #FFFFFF;
      transform: scale(1.12);
    }
    .btn-play:active {
      transform: scale(0.94);
    }

    .vol-btn {
      font-size: 11px;
      width: 26px;
      height: 26px;
      border-radius: 13px;
    }

    /* Custom Modern Dark Rounded Range Slider */
    .chatty-range-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 58px;
      height: 6px;
      border-radius: 3px;
      background: #0C101A;
      border: 1px solid #20283E;
      outline: none;
      cursor: pointer;
      margin: 0 2px 0 4px;
      transition: all 0.2s ease;
      vertical-align: middle;
    }
    .chatty-range-slider:hover {
      border-color: rgba(56, 189, 248, 0.4);
    }
    .chatty-range-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 7px;
      background: #1E2436;
      border: 1.5px solid #38BDF8;
      box-shadow: 0 0 8px rgba(56, 189, 248, 0.6), 0 2px 4px rgba(0, 0, 0, 0.5);
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease;
    }
    .chatty-range-slider::-webkit-slider-thumb:hover {
      transform: scale(1.25);
      background: #28314A;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.9);
    }

    .chatty-anchor-dot {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 12px;
      height: 12px;
      background: #3B82F6;
      border-radius: 50%;
      box-shadow: 0 0 8px #60A5FA;
      cursor: grab;
      z-index: 99999;
      transition: transform 0.15s ease;
    }
    .chatty-anchor-dot:hover {
      transform: scale(1.25);
    }
    .chatty-anchor-dot::after {
      content: '';
      position: absolute;
      top: 4px;
      left: 4px;
      width: 4px;
      height: 4px;
      background: #FFFFFF;
      border-radius: 50%;
    }
  </style>
</head>
<body>
  <div class="player-card">
    <div class="chatty-anchor-dot" title="ChattyWidgets: ЛКМ — переместить, ПКМ — меню"></div>

    <div class="art-container">
      <div class="art-ring paused" id="artRing">
        <img id="coverImg" class="cover-image" alt="Обложка трека" />
        <div class="art-center" id="artCenter"></div>
      </div>
    </div>

    <div class="track-info">
      <!-- Title with running marquee if too long -->
      <div class="marquee-container" id="titleWrapper">
        <span class="track-title" id="trackTitle">Ожидание медиа...</span>
      </div>

      <!-- Artist with running marquee if too long -->
      <div class="artist-row">
        <div class="marquee-container" id="artistWrapper">
          <span class="track-artist" id="trackArtist">Запустите Spotify, Браузер...</span>
        </div>
        <div class="eq-bars" title="Воспроизведение">
          <div class="eq-bar"></div>
          <div class="eq-bar"></div>
          <div class="eq-bar"></div>
        </div>
      </div>

      <!-- Gorgeous Листалка Controls with Volume Slider -->
      <div class="controls-pill">
        <button class="btn" title="Предыдущий трек (Листать назад)" onclick="prevTrack()">⏮</button>
        <button class="btn btn-play" id="playBtn" title="Воспроизведение / Пауза" onclick="togglePlay()">▶</button>
        <button class="btn" title="Следующий трек (Листать вперед)" onclick="nextTrack()">⏭</button>
        <div style="width: 1px; height: 16px; background: rgba(255,255,255,0.12); margin: 0 2px;"></div>
        <button class="btn vol-btn" title="Тише" onclick="volDown()">🔉</button>
        <button class="btn vol-btn" title="Громче" onclick="volUp()">🔊</button>
        <input type="range" class="chatty-range-slider" id="volSlider" min="0" max="100" value="70" oninput="onVolSliderChange(this.value)" title="Регулятор громкости">
      </div>
    </div>
  </div>

  <script>
    let isPlaying = false;
    let isSquareArt = false;
    let lastTitle = '';
    let lastArtist = '';

    // Marquee logic: if text exceeds container, trigger smooth bidirectional scroll
    function updateMarquee(wrapperId, textId, text) {
      const wrapper = document.getElementById(wrapperId);
      const textEl = document.getElementById(textId);
      if (!wrapper || !textEl) return;

      textEl.textContent = text;
      textEl.classList.remove('is-scrolling');
      wrapper.classList.remove('faded');
      textEl.style.removeProperty('--marquee-dist');
      textEl.style.removeProperty('--marquee-dur');

      requestAnimationFrame(() => {
        const overflow = textEl.scrollWidth - wrapper.clientWidth;
        if (overflow > 4) {
          wrapper.classList.add('faded');
          const dist = -(overflow + 16);
          const dur = Math.max(6, Math.round(overflow / 28) + 4);
          textEl.style.setProperty('--marquee-dist', `${dist}px`);
          textEl.style.setProperty('--marquee-dur', `${dur}s`);
          textEl.classList.add('is-scrolling');
        }
      });
    }

    function togglePlay() {
      if (window.chatty) {
        window.chatty.playPause();
      }
      isPlaying = !isPlaying;
      updatePlayState();
      setTimeout(updateMedia, 300);
    }

    function prevTrack() {
      if (window.chatty) window.chatty.prevTrack();
      setTimeout(updateMedia, 350);
    }

    function nextTrack() {
      if (window.chatty) window.chatty.nextTrack();
      setTimeout(updateMedia, 350);
    }

    let prevVolValue = 70;
    function onVolSliderChange(val) {
      const num = parseInt(val, 10);
      if (window.chatty) {
        if (num > prevVolValue) {
          window.chatty.volumeUp();
        } else if (num < prevVolValue) {
          window.chatty.volumeDown();
        }
      }
      prevVolValue = num;
    }

    function volDown() {
      if (window.chatty) window.chatty.volumeDown();
      const slider = document.getElementById('volSlider');
      if (slider) {
        slider.value = Math.max(0, parseInt(slider.value, 10) - 5);
        prevVolValue = parseInt(slider.value, 10);
      }
    }

    function volUp() {
      if (window.chatty) window.chatty.volumeUp();
      const slider = document.getElementById('volSlider');
      if (slider) {
        slider.value = Math.min(100, parseInt(slider.value, 10) + 5);
        prevVolValue = parseInt(slider.value, 10);
      }
    }

    function updatePlayState() {
      const btn = document.getElementById('playBtn');
      const ring = document.getElementById('artRing');
      if (isPlaying) {
        btn.textContent = '⏸';
        ring.classList.remove('paused');
        ring.classList.add('playing');
      } else {
        btn.textContent = '▶';
        ring.classList.add('paused');
        ring.classList.remove('playing');
      }
    }

    function updateMedia() {
      if (!window.chatty) return;
      try {
        const json = window.chatty.getMediaJson();
        if (json) {
          const data = JSON.parse(json);
          const title = data.Title || 'Ожидание медиа...';
          const artist = data.Artist || 'Запустите Spotify, Браузер...';

          if (title !== lastTitle) {
            lastTitle = title;
            updateMarquee('titleWrapper', 'trackTitle', title);
          }
          if (artist !== lastArtist) {
            lastArtist = artist;
            updateMarquee('artistWrapper', 'trackArtist', artist);
          }

          if (typeof data.IsPlaying === 'boolean') {
            isPlaying = data.IsPlaying;
            updatePlayState();
          }

          const img = document.getElementById('coverImg');
          const center = document.getElementById('artCenter');
          if (data.ThumbnailBase64 && data.ThumbnailBase64.length > 20) {
            img.src = data.ThumbnailBase64;
            img.style.display = 'block';
            if (isSquareArt) {
              center.style.display = 'none';
            }
          } else {
            img.style.display = 'none';
            if (!isSquareArt) {
              center.style.display = 'block';
            }
          }
        }
      } catch (e) {
        // ignore
      }
    }

    // Developer Custom Menu Handling
    window.onChattyMenu = function(id) {
      if (id === 'toggle-art-style') {
        isSquareArt = !isSquareArt;
        const ring = document.getElementById('artRing');
        const center = document.getElementById('artCenter');
        if (isSquareArt) {
          ring.classList.add('square-mode');
          center.style.display = 'none';
        } else {
          ring.classList.remove('square-mode');
          const img = document.getElementById('coverImg');
          if (img.style.display !== 'block') {
            center.style.display = 'block';
          }
        }
      } else if (id === 'refresh-media') {
        updateMedia();
      }
    };

    window.addEventListener('resize', () => {
      updateMarquee('titleWrapper', 'trackTitle', lastTitle || 'Ожидание медиа...');
      updateMarquee('artistWrapper', 'trackArtist', lastArtist || 'Запустите Spotify, Браузер...');
    });

    updateMedia();
    setInterval(updateMedia, 1200);
  </script>
</body>
</html>
