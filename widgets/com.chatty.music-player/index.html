<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мини-Медиаплеер</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      background: transparent;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: stretch;
      justify-content: stretch;
      padding: 0;
      margin: 0;
      overflow: hidden;
    }
    .player-card {
      width: 100%;
      height: 100%;
      background: rgba(18, 22, 34, 0.82);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 14px 22px 14px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.15), 0 8px 32px rgba(0, 0, 0, 0.35);
      position: relative;
    }
    .art-container {
      width: 58px;
      height: 58px;
      position: relative;
      flex-shrink: 0;
    }
    .art-ring {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: conic-gradient(from 180deg at 50% 50%, #EC4899 0deg, #8B5CF6 180deg, #3B82F6 360deg);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 16px rgba(139, 92, 246, 0.4);
      animation: spin 14s linear infinite;
      overflow: hidden;
      transition: border-radius 0.3s ease;
    }
    .art-ring.paused {
      animation-play-state: paused;
    }
    .art-ring.square-mode {
      border-radius: 12px;
      animation: none !important;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    }
    @keyframes spin {
      100% { transform: rotate(360deg); }
    }
    .art-center {
      width: 22px;
      height: 22px;
      background: #111420;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.4);
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 2;
    }
    .art-ring.square-mode .art-center {
      display: none;
    }
    .cover-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
      z-index: 1;
    }
    .track-info {
      flex: 1;
      min-width: 0;
    }
    .track-title {
      font-size: 13.5px;
      font-weight: 600;
      color: #F8FAFC;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 2px;
      letter-spacing: -0.2px;
    }
    .track-artist {
      font-size: 11.5px;
      color: #94A3B8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 8px;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #F8FAFC;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.15s ease;
    }
    .btn:hover {
      background: rgba(255, 255, 255, 0.18);
      transform: scale(1.08);
    }
    .btn:active {
      transform: scale(0.95);
    }
    .btn-play {
      background: #6366F1;
      width: 36px;
      height: 36px;
      font-size: 15px;
      box-shadow: 0 0 12px rgba(99, 102, 241, 0.5);
    }
    .btn-play:hover {
      background: #4F46E5;
    }
    .chatty-anchor-dot {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 12px;
      height: 12px;
      background: #3B82F6;
      border-radius: 50%;
      box-shadow: 0 0 8px #60A5FA;
      cursor: grab;
      z-index: 99999;
      transition: transform 0.15s ease;
    }
    .chatty-anchor-dot:hover {
      transform: scale(1.25);
    }
    .chatty-anchor-dot::after {
      content: '';
      position: absolute;
      top: 4px;
      left: 4px;
      width: 4px;
      height: 4px;
      background: #FFFFFF;
      border-radius: 50%;
    }
  </style>
</head>
<body>
  <div class="player-card">
    <div class="chatty-anchor-dot" title="ChattyWidgets: ЛКМ — переместить, ПКМ — меню"></div>
    <div class="art-container">
      <div class="art-ring paused" id="artRing">
        <img id="coverImg" class="cover-image" alt="Обложка трека" />
        <div class="art-center" id="artCenter"></div>
      </div>
    </div>

    <div class="track-info">
      <div class="track-title" id="trackTitle">Ожидание медиа...</div>
      <div class="track-artist" id="trackArtist">Запустите Spotify, Браузер...</div>

      <div class="controls">
        <button class="btn" title="Предыдущий" onclick="prevTrack()">⏮</button>
        <button class="btn btn-play" id="playBtn" title="Воспроизведение / Пауза" onclick="togglePlay()">▶</button>
        <button class="btn" title="Следующий" onclick="nextTrack()">⏭</button>
        <button class="btn" title="Тише" onclick="volDown()" style="margin-left: 4px; font-size: 11px;">🔉</button>
        <button class="btn" title="Громче" onclick="volUp()" style="font-size: 11px;">🔊</button>
      </div>
    </div>
  </div>

  <script>
    let isPlaying = false;
    let isSquareArt = false;

    function togglePlay() {
      if (window.chatty) {
        window.chatty.playPause();
      }
      isPlaying = !isPlaying;
      updatePlayState();
      setTimeout(updateMedia, 300);
    }

    function prevTrack() {
      if (window.chatty) window.chatty.prevTrack();
      setTimeout(updateMedia, 400);
    }

    function nextTrack() {
      if (window.chatty) window.chatty.nextTrack();
      setTimeout(updateMedia, 400);
    }

    function volDown() {
      if (window.chatty) window.chatty.volumeDown();
    }

    function volUp() {
      if (window.chatty) window.chatty.volumeUp();
    }

    function updatePlayState() {
      const btn = document.getElementById('playBtn');
      const ring = document.getElementById('artRing');
      if (isPlaying) {
        btn.textContent = '⏸';
        ring.classList.remove('paused');
      } else {
        btn.textContent = '▶';
        ring.classList.add('paused');
      }
    }

    function updateMedia() {
      if (!window.chatty) return;
      try {
        const json = window.chatty.getMediaJson();
        if (json) {
          const data = JSON.parse(json);
          if (data.Title) {
            document.getElementById('trackTitle').textContent = data.Title;
          }
          if (data.Artist) {
            document.getElementById('trackArtist').textContent = data.Artist;
          }
          if (typeof data.IsPlaying === 'boolean') {
            isPlaying = data.IsPlaying;
            updatePlayState();
          }

          const img = document.getElementById('coverImg');
          const center = document.getElementById('artCenter');
          if (data.ThumbnailBase64 && data.ThumbnailBase64.length > 20) {
            img.src = data.ThumbnailBase64;
            img.style.display = 'block';
            if (isSquareArt) {
              center.style.display = 'none';
            }
          } else {
            img.style.display = 'none';
            if (!isSquareArt) {
              center.style.display = 'block';
            }
          }
        }
      } catch (e) {
        // ignore
      }
    }

    // Developer Custom Menu Handling
    window.onChattyMenu = function(id) {
      if (id === 'toggle-art-style') {
        isSquareArt = !isSquareArt;
        const ring = document.getElementById('artRing');
        const center = document.getElementById('artCenter');
        if (isSquareArt) {
          ring.classList.add('square-mode');
          center.style.display = 'none';
        } else {
          ring.classList.remove('square-mode');
          const img = document.getElementById('coverImg');
          if (img.style.display !== 'block') {
            center.style.display = 'block';
          }
        }
      } else if (id === 'refresh-media') {
        updateMedia();
      }
    };

    updateMedia();
    setInterval(updateMedia, 1200);
  </script>
</body>
</html>
