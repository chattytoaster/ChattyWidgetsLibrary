<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Chatty Timer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="timer-card">
        <!-- Top Pill Nav: Focus vs Normal -->
        <div class="top-nav">
            <button class="nav-tab active" id="tab-focus" onclick="switchMainMode('focus')">🎯 Фокус</button>
            <button class="nav-tab" id="tab-normal" onclick="switchMainMode('normal')">⏱ Обычный</button>
        </div>

        <!-- 1. FOCUS VIEW (Pomodoro) -->
        <div class="mode-view" id="view-focus">
            <div class="mode-selector">
                <button class="mode-btn active" id="btn-mode-work" onclick="setFocusSubMode('work')">🍅 Фокус 25м</button>
                <button class="mode-btn break" id="btn-mode-break" onclick="setFocusSubMode('break')">☕ Отдых 5м</button>
            </div>

            <div class="timer-display">
                <div class="time focus-time" id="focus-timer-text">25:00</div>
                <div class="session-info">
                    <span>Сессий завершено:</span>
                    <strong id="session-count" style="color:#F8FAFC;">0</strong>
                </div>
            </div>

            <div class="controls">
                <button class="action-btn btn-focus" id="btn-focus-toggle" onclick="toggleFocusTimer()">Старт</button>
                <button class="action-btn btn-secondary" onclick="resetFocusTimer()">Сброс</button>
            </div>
        </div>

        <!-- 2. NORMAL VIEW (Countdown & Presets) -->
        <div class="mode-view" id="view-normal" style="display:none;">
            <div class="preset-selector">
                <button class="chip" onclick="addNormalTime(60)">+1м</button>
                <button class="chip" onclick="addNormalTime(300)">+5м</button>
                <button class="chip" onclick="addNormalTime(600)">+10м</button>
                <button class="chip" onclick="addNormalTime(900)">+15м</button>
                <button class="chip" onclick="addNormalTime(1800)">+30м</button>
            </div>

            <div class="timer-display">
                <div class="time normal-time" id="normal-timer-text">05:00</div>
                <div class="session-info">
                    <span id="normal-status-label">Обратный отсчет</span>
                </div>
            </div>

            <div class="controls">
                <button class="action-btn btn-normal" id="btn-normal-toggle" onclick="toggleNormalTimer()">Старт</button>
                <button class="action-btn btn-secondary" onclick="resetNormalTimer()">Сброс</button>
            </div>
        </div>
    </div>

    <script>
        let mainMode = 'focus'; // 'focus' or 'normal'

        // --- Focus Mode State ---
        let focusSubMode = 'work'; // 'work' (25m) or 'break' (5m)
        let focusTimeLeft = 25 * 60;
        let isFocusRunning = false;
        let focusInterval = null;
        let sessionsCompleted = 0;

        // --- Normal Mode State ---
        let normalInitialTime = 5 * 60;
        let normalTimeLeft = 5 * 60;
        let isNormalRunning = false;
        let normalInterval = null;

        // Load persisted settings
        try {
            if (window.chatty && window.chatty.storageGet) {
                sessionsCompleted = parseInt(window.chatty.storageGet('sessions', '0')) || 0;
                document.getElementById('session-count').innerText = sessionsCompleted;

                const savedMain = window.chatty.storageGet('main_mode', 'focus');
                if (savedMain === 'normal') {
                    switchMainMode('normal', false);
                }
            }
        } catch (e) {}

        function playChime() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, ctx.currentTime); // D5
                osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.3); // A5
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.2);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 1.2);
            } catch (e) {}
        }

        function formatDisplay(totalSec) {
            const h = Math.floor(totalSec / 3600);
            const m = Math.floor((totalSec % 3600) / 60);
            const s = totalSec % 60;
            if (h > 0) {
                return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
            }
            return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        // --- Main Mode Switching ---
        function switchMainMode(mode, save = true) {
            mainMode = mode;
            document.getElementById('tab-focus').classList.toggle('active', mode === 'focus');
            document.getElementById('tab-normal').classList.toggle('active', mode === 'normal');

            document.getElementById('view-focus').style.display = mode === 'focus' ? 'flex' : 'none';
            document.getElementById('view-normal').style.display = mode === 'normal' ? 'flex' : 'none';

            if (save && window.chatty && window.chatty.storageSet) {
                window.chatty.storageSet('main_mode', mode);
            }
        }

        // --- Focus (Pomodoro) Logic ---
        function updateFocusDisplay() {
            const el = document.getElementById('focus-timer-text');
            el.innerText = formatDisplay(focusTimeLeft);
            if (focusSubMode === 'break') {
                el.classList.add('break-time');
            } else {
                el.classList.remove('break-time');
            }
        }

        function setFocusSubMode(sub) {
            if (isFocusRunning) toggleFocusTimer();
            focusSubMode = sub;
            document.getElementById('btn-mode-work').classList.toggle('active', sub === 'work');
            document.getElementById('btn-mode-break').classList.toggle('active', sub === 'break');
            focusTimeLeft = sub === 'work' ? 25 * 60 : 5 * 60;
            updateFocusDisplay();
        }

        function toggleFocusTimer() {
            const btn = document.getElementById('btn-focus-toggle');
            if (isFocusRunning) {
                clearInterval(focusInterval);
                isFocusRunning = false;
                btn.innerText = 'Продолжить';
                btn.style.background = focusSubMode === 'work' ? '#EF4444' : '#10B981';
            } else {
                isFocusRunning = true;
                btn.innerText = 'Пауза';
                btn.style.background = '#475569';
                focusInterval = setInterval(() => {
                    if (focusTimeLeft > 0) {
                        focusTimeLeft--;
                        updateFocusDisplay();
                    } else {
                        clearInterval(focusInterval);
                        isFocusRunning = false;
                        btn.innerText = 'Старт';
                        btn.style.background = focusSubMode === 'work' ? '#EF4444' : '#10B981';
                        playChime();

                        if (focusSubMode === 'work') {
                            sessionsCompleted++;
                            document.getElementById('session-count').innerText = sessionsCompleted;
                            if (window.chatty && window.chatty.storageSet) {
                                window.chatty.storageSet('sessions', String(sessionsCompleted));
                            }
                            if (window.chatty && window.chatty.notify) {
                                window.chatty.notify('🍅 Pomodoro завершён!', 'Отличная работа! Сделайте 5-минутный перерыв для отдыха.');
                            }
                            setFocusSubMode('break');
                        } else {
                            if (window.chatty && window.chatty.notify) {
                                window.chatty.notify('☕ Перерыв окончен!', 'Пора возвращаться к продуктивной работе.');
                            }
                            setFocusSubMode('work');
                        }
                    }
                }, 1000);
            }
        }

        function resetFocusTimer() {
            if (isFocusRunning) toggleFocusTimer();
            focusTimeLeft = focusSubMode === 'work' ? 25 * 60 : 5 * 60;
            updateFocusDisplay();
            document.getElementById('btn-focus-toggle').innerText = 'Старт';
            document.getElementById('btn-focus-toggle').style.background = focusSubMode === 'work' ? '#EF4444' : '#10B981';
        }

        // --- Normal Mode Logic ---
        function updateNormalDisplay() {
            const el = document.getElementById('normal-timer-text');
            el.innerText = formatDisplay(normalTimeLeft);
        }

        function addNormalTime(sec) {
            if (normalTimeLeft === 0) {
                normalTimeLeft = sec;
            } else {
                normalTimeLeft += sec;
            }
            normalInitialTime = normalTimeLeft;
            updateNormalDisplay();
        }

        function toggleNormalTimer() {
            const btn = document.getElementById('btn-normal-toggle');
            if (isNormalRunning) {
                clearInterval(normalInterval);
                isNormalRunning = false;
                btn.innerText = 'Продолжить';
                btn.style.background = '#3B82F6';
            } else {
                if (normalTimeLeft <= 0) normalTimeLeft = 300;
                isNormalRunning = true;
                btn.innerText = 'Пауза';
                btn.style.background = '#475569';
                normalInterval = setInterval(() => {
                    if (normalTimeLeft > 0) {
                        normalTimeLeft--;
                        updateNormalDisplay();
                    } else {
                        clearInterval(normalInterval);
                        isNormalRunning = false;
                        btn.innerText = 'Старт';
                        btn.style.background = '#3B82F6';
                        playChime();
                        if (window.chatty && window.chatty.notify) {
                            window.chatty.notify('⏱ Время вышло!', 'Обычный таймер завершил отсчет.');
                        }
                    }
                }, 1000);
            }
        }

        function resetNormalTimer() {
            if (isNormalRunning) toggleNormalTimer();
            normalTimeLeft = normalInitialTime > 0 ? normalInitialTime : 300;
            updateNormalDisplay();
            document.getElementById('btn-normal-toggle').innerText = 'Старт';
            document.getElementById('btn-normal-toggle').style.background = '#3B82F6';
        }

        updateFocusDisplay();
        updateNormalDisplay();
    </script>
</body>
</html>
