name: Validate Widget Submission

on:
  pull_request:
    branches:
      - main
    paths:
      - 'widgets/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    name: Validate Widget Manifest & Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Widget Validator
        run: |
          python scripts/validate_widgets.py
